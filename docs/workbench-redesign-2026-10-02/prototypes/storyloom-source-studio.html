<style>
  #sl-source-studio {
    --sl-bg: light-dark(#f7f7f3, #11191d);
    --sl-paper: light-dark(#ffffff, #192522);
    --sl-soft: light-dark(#f0f3eb, #202c25);
    --sl-ink: light-dark(#293e32, #f3eee2);
    --sl-muted: light-dark(#64745b, #a2b39a);
    --sl-line: light-dark(#dce3d6, #344339);
    --sl-green: light-dark(#365139, #c9dfab);
    --sl-on-green: light-dark(#f0f5e6, #1c3022);
    --sl-warm: light-dark(#b77550, #e7b18c);
    --sl-warm-soft: light-dark(#f7eddf, #3b3023);
    --sl-source-width: 282px;
    color: var(--sl-ink);
    background: var(--sl-bg);
    font:
      14px/1.55 "Inter",
      "PingFang SC",
      "Microsoft YaHei",
      system-ui,
      sans-serif;
    position: relative;
    border: 1px solid var(--sl-line);
    border-radius: 16px;
    overflow: hidden;
    isolation: isolate;
  }
  #sl-source-studio * {
    box-sizing: border-box;
  }
  #sl-source-studio [hidden] {
    display: none !important;
  }
  #sl-source-studio button,
  #sl-source-studio textarea {
    font: inherit;
  }
  #sl-source-studio button {
    cursor: inherit;
  }
  #sl-source-studio button:focus-visible,
  #sl-source-studio textarea:focus-visible {
    outline: 2px solid var(--sl-warm);
    outline-offset: 3px;
  }
  #sl-source-studio .sl-top {
    padding: 17px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--sl-paper);
    border-bottom: 1px solid var(--sl-line);
  }
  #sl-source-studio .sl-identity {
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 0;
  }
  #sl-source-studio .sl-brand {
    font:
      500 24px/1.2 "Noto Serif SC",
      "Songti SC",
      serif;
    letter-spacing: 3px;
    white-space: nowrap;
  }
  #sl-source-studio .sl-project {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    min-width: 0;
    border-left: 1px solid var(--sl-line);
    padding-left: 18px;
  }
  #sl-source-studio .sl-project strong {
    font-weight: 500;
  }
  #sl-source-studio .sl-eyebrow {
    font-size: 11px;
    color: var(--sl-muted);
    letter-spacing: 0.5px;
  }
  #sl-source-studio .sl-actions {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #sl-source-studio .sl-button {
    border: 1px solid var(--sl-line);
    background: var(--sl-paper);
    color: var(--sl-ink);
    padding: 8px 12px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    white-space: normal;
    min-height: 36px;
  }
  #sl-source-studio .sl-button:hover {
    background: var(--sl-soft);
  }
  #sl-source-studio .sl-button.sl-primary {
    background: var(--sl-green);
    color: var(--sl-on-green);
    border-color: var(--sl-green);
  }
  #sl-source-studio .sl-button.sl-quiet {
    background: transparent;
    border-color: transparent;
  }
  #sl-source-studio .sl-button:disabled {
    color: var(--sl-muted);
    opacity: 0.7;
  }
  #sl-source-studio .sl-button[aria-pressed="true"] {
    background: var(--sl-soft);
    border-color: var(--sl-green);
  }
  #sl-source-studio .sl-button.sl-icon {
    width: 36px;
    padding: 8px;
  }
  #sl-source-studio .sl-badge {
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--sl-muted);
    border-radius: 5px;
    padding: 3px 6px;
    background: var(--sl-soft);
    white-space: nowrap;
  }
  #sl-source-studio .sl-badge.sl-warm {
    color: var(--sl-warm);
    background: var(--sl-warm-soft);
  }
  #sl-source-studio .sl-task-count {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--sl-green);
    color: var(--sl-on-green);
    font-size: 11px;
    border-radius: 50%;
  }
  #sl-source-studio .sl-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 22px;
    background: var(--sl-paper);
    border-bottom: 1px solid var(--sl-line);
    flex-wrap: wrap;
  }
  #sl-source-studio .sl-nav-button {
    border: 0;
    background: transparent;
    color: var(--sl-muted);
    padding: 9px 15px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #sl-source-studio .sl-nav-button[aria-selected="true"] {
    background: var(--sl-soft);
    color: var(--sl-green);
  }
  #sl-source-studio .sl-nav-note {
    margin-left: auto;
    font-size: 11px;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-body {
    display: grid;
    grid-template-columns: var(--sl-source-width) minmax(0, 1fr) 44px;
    position: relative;
    min-height: 655px;
  }
  #sl-source-studio[data-inspector="true"] .sl-body {
    grid-template-columns: var(--sl-source-width) minmax(0, 1fr) 224px;
  }
  #sl-source-studio[data-source="false"] .sl-body {
    grid-template-columns: minmax(0, 1fr) 44px;
  }
  #sl-source-studio[data-source="false"][data-inspector="true"] .sl-body {
    grid-template-columns: minmax(0, 1fr) 224px;
  }
  #sl-source-studio .sl-source {
    background: var(--sl-paper);
    border-right: 1px solid var(--sl-line);
    padding: 19px 18px 18px;
    min-width: 0;
    z-index: 2;
  }
  #sl-source-studio .sl-source-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 13px;
  }
  #sl-source-studio .sl-source-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }
  #sl-source-studio .sl-segmented {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--sl-line);
    border-radius: 8px;
    margin-bottom: 15px;
    background: var(--sl-bg);
  }
  #sl-source-studio .sl-segmented button {
    border: 0;
    border-radius: 5px;
    flex: 1;
    background: transparent;
    color: var(--sl-muted);
    padding: 6px 8px;
  }
  #sl-source-studio .sl-segmented button[aria-pressed="true"] {
    background: var(--sl-green);
    color: var(--sl-on-green);
  }
  #sl-source-studio .sl-source-caption {
    font-size: 12px;
    color: var(--sl-muted);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  #sl-source-studio .sl-reading {
    margin: 0;
  }
  #sl-source-studio .sl-fragment {
    padding: 0 0 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--sl-line);
    position: relative;
  }
  #sl-source-studio .sl-fragment:last-child {
    border-bottom: 0;
    margin-bottom: 0;
  }
  #sl-source-studio .sl-fragment-head {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    align-items: center;
    margin-bottom: 10px;
  }
  #sl-source-studio .sl-fragment-select {
    background: transparent;
    border: 0;
    color: var(--sl-muted);
    padding: 3px 0;
    text-align: left;
    display: flex;
    gap: 7px;
    align-items: center;
    font-size: 12px;
  }
  #sl-source-studio .sl-fragment.is-current .sl-fragment-select {
    color: var(--sl-green);
    font-weight: 500;
  }
  #sl-source-studio .sl-fragment.is-current:before {
    content: "";
    position: absolute;
    left: -18px;
    top: 3px;
    bottom: 15px;
    width: 3px;
    background: var(--sl-green);
    border-radius: 0 2px 2px 0;
  }
  #sl-source-studio .sl-paragraph {
    font:
      14px/1.95 "Noto Serif SC",
      "Songti SC",
      serif;
    position: relative;
    margin: 0 0 10px;
    padding-right: 1px;
  }
  #sl-source-studio .sl-paragraph:last-child {
    margin-bottom: 0;
  }
  #sl-source-studio .sl-source-token {
    display: inline;
    background: transparent;
    border: 0;
    color: inherit;
    padding: 0 2px;
    border-radius: 3px;
    font: inherit;
    text-align: left;
    text-decoration: none;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  #sl-source-studio .sl-source-token.is-linked {
    background: var(--sl-warm-soft);
    color: var(--sl-ink);
    border-bottom: 1px solid var(--sl-warm);
  }
  #sl-source-studio .sl-source-token.is-active {
    background: var(--sl-soft);
    color: var(--sl-green);
    border-bottom: 1px solid var(--sl-green);
  }
  #sl-source-studio .sl-source-foot {
    font-size: 11px;
    color: var(--sl-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    border-top: 1px solid var(--sl-line);
    padding-top: 12px;
    margin-top: 12px;
  }
  #sl-source-studio[data-source-view="fragments"] .sl-fragment {
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid var(--sl-line);
    border-radius: 10px;
    background: var(--sl-paper);
  }
  #sl-source-studio[data-source-view="fragments"] .sl-fragment.is-current {
    border-color: var(--sl-green);
    background: var(--sl-soft);
  }
  #sl-source-studio[data-source-view="fragments"]
    .sl-fragment.is-current:before {
    display: none;
  }
  #sl-source-studio .sl-fragment-meta {
    display: none;
    gap: 8px;
    font-size: 11px;
    color: var(--sl-muted);
    margin-top: 10px;
  }
  #sl-source-studio[data-source-view="fragments"] .sl-fragment-meta {
    display: flex;
    flex-wrap: wrap;
  }
  #sl-source-studio .sl-canvas {
    min-width: 0;
    position: relative;
    background-color: var(--sl-bg);
    background-image: radial-gradient(var(--sl-line) 0.8px, transparent 0.8px);
    background-size: 20px 20px;
    display: flex;
    flex-direction: column;
  }
  #sl-source-studio .sl-canvas-top {
    background: var(--sl-bg);
    padding: 18px 22px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    border-bottom: 1px solid var(--sl-line);
  }
  #sl-source-studio .sl-context {
    font-size: 12px;
    color: var(--sl-muted);
    margin-bottom: 4px;
  }
  #sl-source-studio .sl-canvas-title {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
  }
  #sl-source-studio .sl-canvas-top-actions {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #sl-source-studio .sl-canvas-content {
    padding: 23px 25px 24px 58px;
    position: relative;
    flex: 1;
  }
  #sl-source-studio .sl-scene-label {
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--sl-muted);
    font-size: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  #sl-source-studio .sl-node {
    background: var(--sl-paper);
    border: 1px solid var(--sl-line);
    border-radius: 12px;
    box-shadow: 0 3px 12px color-mix(in srgb, var(--sl-ink) 4%, transparent);
    position: relative;
    margin-bottom: 18px;
    overflow: visible;
    min-width: 0;
  }
  #sl-source-studio .sl-node.is-selected {
    border-color: var(--sl-green);
    box-shadow:
      0 0 0 1px var(--sl-green),
      0 3px 12px color-mix(in srgb, var(--sl-ink) 4%, transparent);
  }
  #sl-source-studio .sl-node-head {
    padding: 12px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--sl-line);
  }
  #sl-source-studio .sl-node-kind {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-node-select {
    padding: 15px 17px;
    text-align: left;
    display: block;
    width: 100%;
    background: transparent;
    color: var(--sl-ink);
    border: 0;
    border-radius: 0 0 12px 12px;
  }
  #sl-source-studio .sl-node-select strong {
    display: block;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 7px;
  }
  #sl-source-studio .sl-node-copy {
    display: block;
    font-size: 13px;
    line-height: 1.8;
  }
  #sl-source-studio .sl-node-meta {
    padding: 11px 16px;
    border-top: 1px solid var(--sl-line);
    font-size: 12px;
    color: var(--sl-muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #sl-source-studio .sl-port {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1px solid var(--sl-warm);
    background: var(--sl-paper);
    position: absolute;
    left: -4px;
    top: 50%;
    z-index: 8;
  }
  #sl-source-studio .sl-source-port {
    position: absolute;
    right: -16px;
    top: 45%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1px solid var(--sl-warm);
    background: var(--sl-paper);
  }
  #sl-source-studio .sl-related-note {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--sl-muted);
    padding: 6px 0 13px;
  }
  #sl-source-studio .sl-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 22px;
    background: var(--sl-bg);
    border-top: 1px solid var(--sl-line);
    font-size: 11px;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-green-dot {
    width: 6px;
    height: 6px;
    background: var(--sl-green);
    border-radius: 50%;
    display: inline-block;
  }
  #sl-source-studio .sl-footer-state {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #sl-source-studio .sl-rail {
    background: var(--sl-paper);
    border-left: 1px solid var(--sl-line);
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 10px;
    padding-top: 20px;
  }
  #sl-source-studio .sl-inspector {
    background: var(--sl-paper);
    border-left: 1px solid var(--sl-line);
    padding: 18px 15px;
    min-width: 0;
  }
  #sl-source-studio .sl-inspector-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  #sl-source-studio .sl-inspector-title {
    font-weight: 500;
  }
  #sl-source-studio .sl-field {
    padding: 13px 0;
    border-bottom: 1px solid var(--sl-line);
  }
  #sl-source-studio .sl-field label {
    display: block;
    font-size: 11px;
    color: var(--sl-muted);
    margin-bottom: 6px;
  }
  #sl-source-studio .sl-field p {
    font-size: 13px;
    margin: 0;
    line-height: 1.8;
  }
  #sl-source-studio .sl-field .sl-button {
    margin-top: 8px;
  }
  #sl-source-studio .sl-relations {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  #sl-source-studio .sl-relations path {
    fill: none;
    stroke: var(--sl-warm);
    stroke-width: 1.5;
  }
  #sl-source-studio .sl-relations circle {
    fill: var(--sl-paper);
    stroke: var(--sl-warm);
    stroke-width: 1.4;
  }
  #sl-source-studio .sl-relations text {
    fill: var(--sl-muted);
    font:
      11px "PingFang SC",
      system-ui,
      sans-serif;
  }
  #sl-source-studio .sl-relations rect {
    fill: var(--sl-bg);
  }
  #sl-source-studio .sl-assets {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 17px;
  }
  #sl-source-studio .sl-assets .sl-node {
    margin: 0;
  }
  #sl-source-studio .sl-asset-preview {
    min-height: 102px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: var(--sl-soft);
    position: relative;
    border-radius: 12px 12px 0 0;
  }
  #sl-source-studio .sl-asset-preview svg {
    width: 31px;
    height: 31px;
    stroke-width: 1.1;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-asset-preview span {
    font-size: 11px;
    color: var(--sl-muted);
    max-width: 100%;
    padding: 0 8px;
    text-align: center;
    overflow-wrap: anywhere;
  }
  #sl-source-studio .sl-asset-title {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    align-items: center;
    margin-bottom: 9px;
  }
  #sl-source-studio .sl-asset-version {
    font-size: 11px;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-use-count {
    font-size: 11px;
    color: var(--sl-muted);
    padding: 0 16px 12px;
  }
  #sl-source-studio .sl-storyboard {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  #sl-source-studio .sl-storyboard .sl-node-head {
    padding: 9px;
  }
  #sl-source-studio .sl-storyboard .sl-node-select {
    padding: 11px;
  }
  #sl-source-studio .sl-shot-image {
    height: 93px;
    background: var(--sl-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--sl-line);
  }
  #sl-source-studio .sl-shot-image svg {
    width: 27px;
    height: 27px;
    color: var(--sl-muted);
    stroke-width: 1;
  }
  #sl-source-studio .sl-shot-image small {
    font-size: 11px;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-shot-number {
    font-size: 11px;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-input-list {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 17px;
    padding-top: 15px;
    border-top: 1px solid var(--sl-line);
  }
  #sl-source-studio .sl-form-label {
    display: block;
    font-size: 12px;
    color: var(--sl-muted);
    margin-bottom: 8px;
  }
  #sl-source-studio .sl-cut-editor {
    padding: 16px;
  }
  #sl-source-studio textarea {
    width: 100%;
    resize: vertical;
    min-height: 151px;
    border: 1px solid var(--sl-line);
    border-radius: 8px;
    color: var(--sl-ink);
    background: var(--sl-bg);
    padding: 12px;
    line-height: 1.85;
    font-size: 14px;
  }
  #sl-source-studio .sl-form-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-top: 13px;
  }
  #sl-source-studio .sl-selected-text {
    font-size: 12px;
    color: var(--sl-muted);
    margin-top: 12px;
  }
  #sl-source-studio .sl-selected-range {
    border-left: 2px solid var(--sl-warm);
    padding: 8px 12px;
    background: var(--sl-warm-soft);
    margin: 11px 0;
    color: var(--sl-ink);
    font-size: 13px;
    line-height: 1.8;
  }
  #sl-source-studio .sl-fragment-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 20px;
  }
  #sl-source-studio .sl-fragment-strip button {
    font-size: 12px;
  }
  #sl-source-studio .sl-preview {
    height: 172px;
    border-radius: 12px;
    background: var(--sl-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
    border: 1px solid var(--sl-line);
  }
  #sl-source-studio .sl-preview svg {
    width: 30px;
    height: 30px;
    color: var(--sl-muted);
    stroke-width: 1.2;
  }
  #sl-source-studio .sl-preview span {
    font-size: 12px;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-track {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    margin: 11px 0;
    font-size: 11px;
    color: var(--sl-muted);
  }
  #sl-source-studio .sl-track-clips {
    display: flex;
    gap: 5px;
    padding: 8px 0;
    border-top: 1px solid var(--sl-line);
    border-bottom: 1px solid var(--sl-line);

          y +
          ", " +
          jx +
          " " +
          y,
        "sl-region-trunk",
      );
      origin(x, y, current().id);
      links.forEach(function (l) {
        const dx = Math.max(8, Math.min(70, (l.point.x - jx) * 0.6));
        path(
          "M " +
            jx +
            " " +
            y +
            " C " +
            (jx + dx) +
            " " +
            y +
            ", " +
            (l.point.x - dx) +
            " " +
            l.point.y +
            ", " +
            l.point.x +
            " " +
            l.point.y,
          "sl-region-branch",
          l.target,
        );
        if (Math.abs(l.point.y - y) > 30)
          label(l.label, (jx + l.point.x) / 2, (y + l.point.y) / 2);
      });
    }
    function setTask(task) {
      stopPlayback();
      viewState().selected = state.selected;
      state.contextRef = null;
      state.task = task;
      state.selected = viewState().selected;
      if (task === "film") state.view = "fragments";
      else contexts[state.fragment] = { task: task, selected: state.selected };
      render();
      save();
      announce(
        "片段 " +
          ("0" + (state.fragment + 1)) +
          " 已切换到" +
          names[task] +
          "；来源视图保留，后台任务继续。",
      );
    }
    function setFragment(index, override) {
      if (index < 0 || index >= fragments.length) return;
      if (state.task === "film" && !override) {
        const r = videos.find(function (r) {
          return r.fragment === fragments[index].id;
        });
        state.fragment = index;
        state.contextRef = null;
        if (r) {
          state.edit.resource = r.id;
          state.selected = "resource:" + r.id;
        }
        render();
        save();
        announce("已在资源区定位 " + current().name + "，项目剪辑继续保留。");
        return;
      }
      stopPlayback();
      viewState().selected = state.selected;
      if (state.task !== "film")
        contexts[state.fragment] = {
          task: state.task,
          selected: state.selected,
        };
      state.fragment = index;
      const c = contexts[index] || { task: current().task };
      state.task = override || c.task;
      state.selected = viewState().selected;
      state.contextRef = null;
      state.selectedText = "";
      state.selectionSources = [];
      state.pendingRange = null;
      render();
      save();
      announce(
        "已返回片段 " +
          ("0" + (index + 1)) +
          " · " +
          current().name +
          " 的" +
          names[state.task] +
          "工作位置，其他任务继续运行。",
      );
    }
    let gesture = null,
      suppressClick = false;
    root.addEventListener("pointerdown", function (event) {
      if (state.task === "film" || event.button !== 0) return;
      const stage = q(".sl-canvas-content"),
        node = event.target.closest(".sl-world .sl-node"),
        handle = event.target.closest(".sl-drag"),
        head = event.target.closest(".sl-node-head");
      if (node && (handle || (head && !event.target.closest("button")))) {
        const id = node.dataset.node,
          p = viewState().positions[id];
        selectObject(id);
        gesture = {
          kind: "node",
          id: id,
          startX: event.clientX,
          startY: event.clientY,
          x: p.x,
          y: p.y,
          moved: false,
          pointer: event.pointerId,
          capture: handle || head,
        };
        gesture.capture.setPointerCapture(event.pointerId);
        event.preventDefault();
        return;
      }
      if (
        stage.contains(event.target) &&
        !node &&
        !event.target.closest("button,.sl-viewport-tools")
      ) {
        const v = viewState();
        gesture = {
          kind: "pan",
          startX: event.clientX,
          startY: event.clientY,
          x: v.x,
          y: v.y,
          moved: false,
          pointer: event.pointerId,
          capture: stage,
        };
        stage.setPointerCapture(event.pointerId);
        event.preventDefault();
      }
    });
    root.addEventListener("pointermove", function (event) {
      if (!gesture || gesture.pointer !== event.pointerId) return;
      const dx = event.clientX - gesture.startX,
        dy = event.clientY - gesture.startY,
        v = viewState();
      if (Math.abs(dx) + Math.abs(dy) > 4) gesture.moved = true;
      if (gesture.kind === "node") {
        const p = v.positions[gesture.id],
          node = q('[data-node="' + gesture.id + '"]');
        p.x = gesture.x + dx / v.zoom;
        p.y = gesture.y + dy / v.zoom;
        node.style.left = p.x + "px";
        node.style.top = p.y + "px";
        requestAnimationFrame(drawLines);
      } else {
        v.x = gesture.x + dx;
        v.y = gesture.y + dy;
        updateCanvasTransform();
      }
    });
    function finishGesture(event) {
      if (!gesture || gesture.pointer !== event.pointerId) return;
      const g = gesture;
      gesture = null;
      if (g.capture.hasPointerCapture(event.pointerId))
        g.capture.releasePointerCapture(event.pointerId);
      suppressClick = g.moved;
      setTimeout(function () {
        suppressClick = false;
      }, 0);
      if (g.kind === "pan" && !g.moved) selectObject(null);
      inspectorView();
      icons();
      save();
      if (g.moved)
        announce(
          g.kind === "node"
            ? "对象位置已更新；来源连线同步移动。"
            : "画布视野已平移，切换后仍可恢复。",
        );
    }
    root.addEventListener("pointerup", finishGesture);
    root.addEventListener("pointercancel", finishGesture);
    root.addEventListener("dragstart", function (event) {
      if (state.task !== "film") return;
      const clip = event.target.closest("[data-edit-clip]"),
        resource = event.target.closest("[data-resource-preview]");
      if (event.dataTransfer && (clip || resource)) {
        event.dataTransfer.setData(
          "text/plain",
          clip
            ? "clip:" + clip.dataset.editClip
            : "resource:" + resource.dataset.resourcePreview,
        );
        event.dataTransfer.effectAllowed = clip ? "move" : "copy";
      }
    });
    root.addEventListener("dragover", function (event) {
      if (state.task === "film" && event.target.closest("[data-edit-track]"))
        event.preventDefault();
    });
    root.addEventListener("drop", function (event) {
      if (
        state.task !== "film" ||
        !event.target.closest("[data-edit-track]") ||
        !event.dataTransfer
      )
        return;
      event.preventDefault();
      const data = event.dataTransfer.getData("text/plain"),
        target = event.target.closest("[data-edit-clip]");
      if (data.startsWith("resource:")) insertResource(data.slice(9));
      if (data.startsWith("clip:"))
        reorderClip(
          data.slice(5),
          target
            ? state.edit.clips.findIndex(function (c) {
                return c.id === target.dataset.editClip;
              })
            : state.edit.clips.length - 1,
        );
    });
    root.addEventListener(
      "wheel",
      function (event) {
        const stage = q(".sl-canvas-content");
        if (
          state.task === "film" ||
          !stage.contains(event.target) ||
          (!event.ctrlKey && !event.metaKey)
        )
          return;
        event.preventDefault();
        const r = stage.getBoundingClientRect();
        zoomCanvas(event.deltaY > 0 ? 0.9 : 1.1, {
          x: event.clientX - r.left,
          y: event.clientY - r.top,
        });
      },
      { passive: false },
    );
    root.addEventListener("click", function (event) {
      if (suppressClick) {
        event.preventDefault();
        return;
      }
      const assetMention = event.target.closest("[data-source-asset]");
      if (
        assetMention &&
        state.task === "assets" &&
        window.getSelection()?.isCollapsed
      ) {
        event.preventDefault();
        state.pendingRange = null;
        selectObject(assetMention.dataset.sourceAsset);
        save();
        return;
      }
      const b = event.target.closest("button,a.sl-source-token,a.sl-highlight");
      if (!b || !root.contains(b) || b.disabled) {
        const node = event.target.closest(".sl-world .sl-node");
        if (node) {
          selectObject(node.dataset.node);
          save();
        }
        return;
      }
      if (b.tagName === "A") event.preventDefault();
      if (b.dataset.regionId) {
        if (window.getSelection() && !window.getSelection().isCollapsed) return;
        state.pendingRange = null;
        setFragment(
          fragments.findIndex(function (f) {
            return f.id === b.dataset.regionId;
          }),
        );
        return;
      }
      if (b.dataset.drag) {
        selectObject(b.dataset.drag);
        save();
        return;
      }
      if (b.dataset.task) {
        setTask(b.dataset.task);
        return;
      }
      if (b.dataset.resourceFragment !== undefined) {
        setFragment(Number(b.dataset.resourceFragment));
        return;
      }
      if (b.dataset.resourcePreview) {
        stopPlayback();
        const r = video(b.dataset.resourcePreview);
        state.edit.resource = r.id;
        state.selected = "resource:" + r.id;
        state.contextRef = null;
        state.fragment = fragments.findIndex(function (f) {
          return f.id === r.fragment;
        });
        render();
        save();
        announce(
          "已预览 " +
            r.fragment +
            " / " +
            r.shot +
            " " +
            r.version +
            "，可加入项目时间轴。",
        );
        return;
      }
      if (b.dataset.insertResource) {
        insertResource(b.dataset.insertResource);
        return;
      }
      if (b.dataset.view) {
        state.view = b.dataset.view;
        render();
        save();
        announce(
          "故事来源切换为" +
            (state.view === "original" ? "连续原文" : "已切分片段") +
            "，仍使用同一份故事正文。",
        );
        return;
      }
      if (b.dataset.fragment !== undefined) {
        setFragment(Number(b.dataset.fragment));
        return;
      }
      if (b.dataset.returnFragment !== undefined) {
        q(".sl-task-popover").hidden = true;
        setFragment(Number(b.dataset.returnFragment), b.dataset.returnTask);
        return;
      }
      if (b.dataset.openTask) {
        setTask(b.dataset.openTask);
        return;
      }
      if (b.dataset.assetLink) {
        state.contextRef = { type: "asset", id: b.dataset.assetLink };
        state.inspector = true;
        render();
        save();
        announce(
          "在当前分镜工作区查看 " +
            assets.find(function (a) {
              return a.id === b.dataset.assetLink;
            }).name +
            " 的资源上下文。",
        );
        return;
      }
      if (b.dataset.scriptSource) {
        const i = Number(
          b.closest("[data-fragment-block]").dataset.fragmentBlock,
        );
        if (state.task === "script" && i === state.fragment) {
          state.contextRef = null;
          state.selected = b.dataset.scriptSource;
        } else {
          state.contextRef = {
            type: "script",
            id: b.dataset.scriptSource,
            fragment: i,
          };
          if (state.task === "film") state.filmInspector = true;
          else state.inspector = true;
        }
        render();
        save();
        announce("已查看原文对应的剧本内容，当前工作标签保持。");
        return;
      }
      if (b.dataset.assetSource) {
        if (state.task !== "assets") {
          state.contextRef = { type: "asset", id: b.dataset.assetSource };
          if (state.task === "film") state.filmInspector = true;
          else state.inspector = true;
          render();
          announce("在当前任务查看原文资产的上下文，工作标签保持。");
        } else {
          state.contextRef = null;
          state.selected = b.dataset.assetSource;
          render();
          announce(
            "已展开 " +
              assets.find(function (a) {
                return a.id === state.selected;
              }).name +
              " 的原文出现位置与共用关系。",
          );
        }
        save();
        return;
      }
      if (b.dataset.select) {
        selectObject(b.dataset.select);
        save();
        announce("已选择 " + objectInfo().title + "，对象属性和步骤对话同步。");
        return;
      }
      const action = b.dataset.action;
      if (action === "cancel-range") {
        state.pendingRange = null;
        state.selectedText = "";
        state.selectionSources = [];
        render();
        announce("选区已取消，原文与已有片段保留。");
        return;
      }
      if (action === "film-play") {
        togglePlayback();
        return;
      }
      if (action === "clip-left" || action === "clip-right") {
        const index = state.edit.clips.findIndex(function (c) {
          return c.id === state.selected;
        });
        reorderClip(state.selected, index + (action === "clip-left" ? -1 : 1));
        return;
      }
      if (action === "clip-remove") {
        const index = state.edit.clips.findIndex(function (c) {
          return c.id === state.selected;
        });
        if (index >= 0) {
          stopPlayback();
          state.edit.clips.splice(index, 1);
          state.selected =
            state.edit.clips[Math.min(index, state.edit.clips.length - 1)]
              ?.id || "timeline";
          syncSelectedClip();
          render();
          save();
          announce("已从时间轴移除视频引用，左侧故事资源保留。");
        }
        return;
      }
      if (action === "new-fragment" || action === "candidate") {
        createFragment();
        return;
      }
      if (action === "zoom-in") {
        zoomCanvas(1.15);
        return;
      }
      if (action === "zoom-out") {
        zoomCanvas(1 / 1.15);
        return;
      }
      if (action === "fit") {
        fitCanvas();
        return;
      }
      if (action === "agent-history") {
        state.historyOpen = !state.historyOpen;
        renderAgent();
        icons();
        return;
      }
      if (action === "send-agent") {
        sendAgent();
        return;
      }
      if (action === "source" || action === "reopen") {
        state.source = !state.source;
        render();
        save();
        return;
      }
      if (action === "lines") {
        state.lines = !state.lines;
        render();
        save();
        announce(
          state.lines
            ? "已展开当前对象的局部来源关系。"
            : "来源连线已收起，对应关系继续保留。",
        );
        return;
      }
      if (action === "inspector") {
        if (state.task === "film") state.filmInspector = !state.filmInspector;
        else state.inspector = !state.inspector;
        render();
        save();
        if (q(".sl-inspector").hidden)
          q(".sl-canvas-top [data-action=inspector]").focus();
        return;
      }
      if (action === "tasks") {
        q(".sl-task-popover").hidden = !q(".sl-task-popover").hidden;
        qa("[data-action=tasks]").forEach(function (e) {
          e.setAttribute("aria-expanded", !q(".sl-task-popover").hidden);
        });
        return;
      }
      if (action === "theme") {
        const isDark =
          getComputedStyle(root).colorScheme === "dark" ||
          (state.theme === "auto" &&
            window.matchMedia("(prefers-color-scheme:dark)").matches);
        state.theme = isDark ? "light" : "dark";
        root.style.colorScheme = state.theme;
        save();
        return;
      }
      if (action === "restore-cut") {
        delete state.drafts[current().id];
        delete state.confirmed[current().id];
        render();
        save();
        announce("裁减草稿已恢复为原始选取范围。");
        return;
      }
      if (action === "confirm-cut") {
        state.drafts[current().id] = q("#sl-cut-text").value.trim();
        if (!state.drafts[current().id]) {
          announce("片段正文不能为空。");
          q("#sl-cut-text").focus();
          return;
        }
        state.confirmed[current().id] = true;
        render();
        save();
        announce("示例片段已确认；原文出处保留，进入剧本由你主动选择。");
        return;
      }
      if (action === "locate") {
        const source = objectInfo().source;
        state.source = true;
        state.view = "original";
        render();
        const paragraph =
          source.length && q('[data-paragraph="' + source[0] + '"]');
        if (paragraph) {
          paragraph.style.background = "var(--sl-warm-soft)";
          paragraph.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
        save();
        announce("已定位当前对象的原文出处 " + source.join("、") + "。");
        return;
      }
    });
    root.addEventListener("input", function (event) {
      if (event.target.id === "sl-film-seek") {
        stopPlayback();
        state.edit.time = Number(event.target.value);
        updatePlayback();
        q("[data-action=film-play]").innerHTML = icon("play");
        icons();
      }
      if (event.target.id === "sl-cut-text") {
        state.drafts[current().id] = event.target.value;
        delete state.confirmed[current().id];
        q("#sl-cut-count").textContent =
          "原范围 " +
          originalTexts[state.fragment].length +
          " 字 · 草稿 " +
          event.target.value.length +
          " 字";
        inspectorView();
        save();
      }
      if (event.target.id === "sl-agent-input") {
        chatState().draft = event.target.value;
        save();
      }
    });
    root.addEventListener("change", function (event) {
      if (event.target.id === "sl-film-seek") {
        save();
        return;
      }
      if (event.target.id === "sl-object-name") {
        const name = event.target.value.trim();
        if (name) {
          current().name = name;
          const extra = state.extraFragments.find(function (f) {
            return f.id === current().id;
          });
          if (extra) extra.name = name;
          render();
          save();
          announce("片段名称已更新，导航入口同步。");
        }
      }
    });
    q(".sl-source").addEventListener("mouseup", captureSourceSelection);
    q(".sl-source").addEventListener("keyup", function (event) {
      if (event.key === "Shift") captureSourceSelection();
    });
    q(".sl-source").addEventListener("pointerup", function (event) {
      if (event.pointerType !== "mouse") setTimeout(captureSourceSelection, 0);
    });
    root.addEventListener("keydown", function (event) {
      const handle = event.target.closest(".sl-drag");
      if (
        handle &&
        ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)
      ) {
        event.preventDefault();
        const id = handle.dataset.drag,
          p = viewState().positions[id],
          amount = event.shiftKey ? 40 : 10;
        p.x +=
          event.key === "ArrowLeft"
            ? -amount
            : event.key === "ArrowRight"
              ? amount
              : 0;
        p.y +=
          event.key === "ArrowUp"
            ? -amount
            : event.key === "ArrowDown"
              ? amount
              : 0;
        const node = q('[data-node="' + id + '"]');
        node.style.left = p.x + "px";
        node.style.top = p.y + "px";
        state.selected = id;
        markSelection();
        inspectorView();
        icons();
        requestAnimationFrame(drawLines);
        save();
        return;
      }
      if (
        event.target.id === "sl-agent-input" &&
        event.key === "Enter" &&
        (event.ctrlKey || event.metaKey)
      ) {
        event.preventDefault();
        sendAgent();
        return;
      }
      if (event.key === "Escape") {
        q(".sl-task-popover").hidden = true;
        if (state.pendingRange) {
          state.pendingRange = null;
          state.selectedText = "";
          state.selectionSources = [];
          render();
          return;
        }
        if (!q(".sl-inspector").hidden) {
          if (state.task === "film") state.filmInspector = false;
          else state.inspector = false;
          render();
          q(".sl-canvas-top [data-action=inspector]").focus();
        }
      }
    });
    if (window.openai && window.openai.widgetState)
      applySaved(window.openai.widgetState);
    window.addEventListener("openai:set_globals", function (event) {
      const saved =
        event.detail &&
        event.detail.globals &&
        event.detail.globals.widgetState;
      if (
        saved &&
        (!saved.privateContent ||
          saved.privateContent.snapshot !== lastSavedSnapshot)
      ) {
        applySaved(saved);
        render();
      }
    });
    render();
    announce(
      state.task === "film"
        ? "从左侧故事片段取用视频，在时间轴上编排成片。"
        : "一块荧光区域对应一个故事片段；划选未标注正文可建立新候选。",
    );
    if (globalThis.ResizeObserver) new ResizeObserver(drawLines).observe(root);
    if (globalThis.Tweak) {
      const tweak = new Tweak({
        container: root,
        onChange: function () {
          render();
        },
      });
      tweak.addSlider(state, "sourceWidth", {
        label: "故事来源区宽度",
        min: 248,
        max: 330,
        step: 2,
        unit: "px",
        reference: "--sl-source-width",
      });
      tweak.addToggle(state, "inspector", { label: "展示属性面板" });
      tweak.addToggle(state, "lines", { label: "展示来源连线" });
    }
  })();
</script>
