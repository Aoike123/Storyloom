version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    assignees:
      - Aoike123
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    assignees:
      - Aoike123
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      web-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    assignees:
      - Aoike123
    groups:
      github-actions:
        patterns:
          - "*"
